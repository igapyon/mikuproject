name: Release runtime bundles

on:
  release:
    types:
      - published
  workflow_dispatch:
    inputs:
      tag_name:
        description: "GitHub Release tag to attach the runtime bundles to"
        required: true
        type: string

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  release-runtime-bundles:
    runs-on: ubuntu-latest
    if: startsWith(github.event.release.tag_name || github.event.inputs.tag_name, 'v')

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag_name || github.event.release.tag_name || github.ref }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Prepare release assets
        env:
          TAG_NAME: ${{ github.event.inputs.tag_name || github.event.release.tag_name || github.ref_name }}
        run: |
          set -euo pipefail
          VERSION="${TAG_NAME#v}"
          PACKAGE_VERSION="$(node -p "require('./package.json').version")"
          case "${VERSION}" in
            "${PACKAGE_VERSION}"|"${PACKAGE_VERSION}".*) ;;
            *)
              echo "Release tag version (${VERSION}) must match package.json version (${PACKAGE_VERSION}) or add a dot suffix such as ${PACKAGE_VERSION}.2." >&2
              exit 1
              ;;
          esac

          mkdir -p release-assets
          cp bundle/miku-project.mjs "release-assets/miku-project-${VERSION}.mjs"
          cp bundle/miku-project-runtime.mjs "release-assets/miku-project-runtime-${VERSION}.mjs"
          cp bundle/miku-project-sources.tgz "release-assets/miku-project-sources-${VERSION}.tgz"
          node scripts/create-browser-runtime-manifest.mjs \
            "release-assets/miku-project-runtime-${VERSION}.mjs" \
            --release-tag "${TAG_NAME}" \
            --out "release-assets/miku-project-runtime-${VERSION}.json"
          (
            cd release-assets
            sha256sum \
              "miku-project-${VERSION}.mjs" \
              "miku-project-runtime-${VERSION}.mjs" \
              "miku-project-runtime-${VERSION}.json" \
              "miku-project-sources-${VERSION}.tgz" \
              > "miku-project-SHA256SUMS-${VERSION}.txt"
          )

      - name: Verify runtime assets
        env:
          TAG_NAME: ${{ github.event.inputs.tag_name || github.event.release.tag_name || github.ref_name }}
        run: |
          set -euo pipefail
          VERSION="${TAG_NAME#v}"
          PACKAGE_VERSION="$(node -p "require('./package.json').version")"
          node "release-assets/miku-project-${VERSION}.mjs" --version
          node scripts/smoke-browser-runtime.mjs \
            "release-assets/miku-project-runtime-${VERSION}.mjs" \
            --expected-version "${PACKAGE_VERSION}"
          node scripts/verify-browser-runtime-manifest.mjs \
            "release-assets/miku-project-runtime-${VERSION}.json" \
            "release-assets/miku-project-runtime-${VERSION}.mjs" \
            --expected-release-tag "${TAG_NAME}"
          (
            cd release-assets
            sha256sum --check "miku-project-SHA256SUMS-${VERSION}.txt"
          )

      - name: Upload runtime bundles to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.tag_name || github.event.release.tag_name || github.ref_name }}
          files: release-assets/*
          draft: false
          prerelease: false
