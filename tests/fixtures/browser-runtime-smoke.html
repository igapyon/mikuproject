<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>miku-project browser runtime smoke</title>
</head>
<body data-status="loading">
  <main>
    <h1>miku-project browser runtime smoke</h1>
    <pre id="result">loading</pre>
  </main>
  <script type="module">
    import loadMikuProjectRuntime, {
      embeddedCorePaths,
      version
    } from "/bundle/miku-project-runtime.mjs";

    try {
      const api = loadMikuProjectRuntime({ expectedVersion: version });
      if (api !== globalThis.__mikuProjectCoreApi || api !== globalThis.__mikuprojectCoreApi) {
        throw new Error("core API global aliases are not aligned");
      }
      const result = {
        ok: true,
        version,
        embedded_core_paths: embeddedCorePaths.length,
        ai_json_spec_id: api.getAiJsonSpec().id
      };
      document.body.dataset.status = "ok";
      document.getElementById("result").textContent = JSON.stringify(result, null, 2);
    } catch (error) {
      document.body.dataset.status = "error";
      document.getElementById("result").textContent = String(error?.stack || error);
    }
  </script>
</body>
</html>
